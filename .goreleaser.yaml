# Release config for GoReleaser v2. The release workflow runs it on every
# v* tag and attaches the archives and checksums.txt to the GitHub release,
# which is what install.sh downloads.
version: 2

project_name: ine

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/ine
    binary: ine
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
